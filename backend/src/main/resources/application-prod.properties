# Production (Render). Every secret comes from an environment variable set in the Render
# dashboard; nothing secret is committed. Activated by SPRING_PROFILES_ACTIVE=prod.

server.port=${PORT:8080}
# Render terminates HTTPS in front of the app
server.forward-headers-strategy=framework

# Supabase: use the Session pooler connection (IPv4), not the direct one (IPv6 only)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# The session pooler allows 15 connections in total, shared with local dev
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

forkast.auth.jwt-secret=${JWT_SECRET}
forkast.admin.api-key=${ADMIN_API_KEY}

forkast.pricing.kroger.client-id=${KROGER_CLIENT_ID:}
forkast.pricing.kroger.client-secret=${KROGER_CLIENT_SECRET:}

forkast.email.api-key=${RESEND_API_KEY}
forkast.email.from=${EMAIL_FROM}
